name: Build EPIC OS ISO
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y live-build debootstrap squashfs-tools xorriso sudo
      - run: cd EPIC_OS_x64_live_build && bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: epic-os-x64-iso
          path: |
            EPIC_OS_x64_live_build/epic-os-x64.iso
            EPIC_OS_x64_live_build/epic-os-x64.iso.sha256
